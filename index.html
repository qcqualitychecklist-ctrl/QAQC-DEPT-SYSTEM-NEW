<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QAQC Department System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fb; color: #172033;
    }
    main {
      width: 100%; max-width: 480px; padding: 32px 24px;
      border-radius: 18px; background: #fff; text-align: center;
      box-shadow: 0 10px 32px rgba(20, 35, 65, .10);
    }
    .mark { font-size: 38px; margin-bottom: 12px; }
    h1 { font-size: 23px; margin: 0 0 10px; }
    p { color: #5b6578; line-height: 1.55; margin: 0 0 22px; }
    a {
      display: inline-block; padding: 14px 22px; border-radius: 10px;
      background: #1457c5; color: white; font-weight: 700;
      text-decoration: none;
    }
    a:focus, a:hover { background: #0e439c; }
    .note { font-size: 12px; margin: 18px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">📋</div>
    <h1>QAQC Department System</h1>
    <p>Click the button below to open the live system.</p>
    <a href="https://script.google.com/macros/s/AKfycbykEyOW6M0eVpQUQsjJEIuQV1tmgZBIb0TiJlG798ySF4WtVgSOQYehFoVnrtPwP3emww/exec">Open QAQC System</a>
    <p class="note">If the system does not open, use the direct Apps Script link provided by your administrator.</p>
  </main>
</body>
</html>
