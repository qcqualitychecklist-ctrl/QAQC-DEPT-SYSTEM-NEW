<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QAQC 2027 SYSTEM | Department Login</title>
  <style>
    :root { --navy:#142b4a; --blue:#2459a9; --blue-dark:#174784; --ink:#17253a; --muted:#68778c; --line:#dce4ef; --bg:#f3f6fb; }
    * { box-sizing:border-box; }
    body {
      min-height:100vh; margin:0; padding:28px;
      display:grid; place-items:center;
      font-family:Arial,Helvetica,sans-serif; color:var(--ink);
      background:radial-gradient(ellipse at 15% 10%,#e1ebfa 0,transparent 42%),linear-gradient(135deg,#f5f7fb,#eaf0f8);
    }
    .login-shell {
      width:min(100%,430px); padding:34px 36px 28px;
      background:#fff; border:1px solid #e5ebf3; border-radius:18px;
      box-shadow:0 18px 55px rgba(20,43,74,.13);
    }
    .brand { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:26px; }
    .brand-mark {
      width:48px; height:48px; display:grid; place-items:center; flex:0 0 48px;
      border-radius:12px; background:var(--navy); color:#fff; font-size:23px; font-weight:800;
      letter-spacing:-1px;
    }
    .brand-copy { text-align:left; }
    .brand-copy strong { display:block; color:var(--navy); font-size:19px; letter-spacing:.5px; }
    .brand-copy span { display:block; margin-top:4px; color:var(--muted); font-size:10px; letter-spacing:1.45px; text-transform:uppercase; }
    .divider { height:1px; background:var(--line); margin:0 0 25px; }
    h1 { margin:0 0 7px; text-align:center; color:var(--navy); font-size:22px; }
    .subtitle { margin:0 0 25px; text-align:center; color:var(--muted); font-size:13px; line-height:1.5; }
    .field { margin-bottom:17px; }
    label { display:block; margin-bottom:7px; color:#34445c; font-size:12px; font-weight:700; }
    input {
      width:100%; height:45px; padding:0 13px; border:1px solid #cfd9e7; border-radius:8px;
      outline:none; background:#fff; color:var(--ink); font-size:14px;
      transition:border-color .15s,box-shadow .15s;
    }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(36,89,169,.12); }
    button, .guest {
      width:100%; min-height:45px; display:flex; align-items:center; justify-content:center;
      border-radius:8px; font-size:13px; font-weight:700; text-decoration:none; cursor:pointer;
      transition:background .15s,border-color .15s,transform .15s;
    }
    .login-button { margin-top:7px; border:1px solid var(--blue); background:var(--blue); color:#fff; }
    .login-button:hover { background:var(--blue-dark); }
    .or { display:flex; align-items:center; gap:12px; margin:20px 0; color:#8a96a8; font-size:11px; }
    .or::before,.or::after { content:""; height:1px; flex:1; background:var(--line); }
    .guest { border:1px solid #cbd6e5; background:#fff; color:var(--navy); }
    .guest:hover { background:#f3f7fd; border-color:#9db4d4; }
    .footer { margin:23px 0 0; text-align:center; color:#8a96a8; font-size:10px; line-height:1.5; }
    @media(max-width:480px) { body{padding:16px}.login-shell{padding:28px 22px 23px}.brand-copy strong{font-size:17px} }
  </style>
</head>
<body>
  <main class="login-shell">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">Q</div>
      <div class="brand-copy">
        <strong>QAQC 2027 SYSTEM</strong>
        <span>Quality Assurance &amp; Quality Control</span>
      </div>
    </div>
    <div class="divider"></div>
    <h1>Department Login</h1>
    <p class="subtitle">Sign in to access the QAQC Department System.</p>
    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password">
      </div>
      <button class="login-button" type="submit">Log In</button>
    </form>
    <div class="or">OR</div>
    <a class="guest" href="https://script.google.com/macros/s/AKfycbxRcTDJJSXCRZhi9DlsWi9oF2V0e1PwU1tizUCuw0prLZzW9eNhqpMKyJrBOnKoACkqig/exec">Continue as Guest</a>
    <p class="footer">QAQC Department System · 2027</p>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      alert('Department Login is a visual preview. Username and password authentication is not yet connected.');
    });
  </script>
</body>
</html>
